<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bússola Eleitoral 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --accent-color: #3b82f6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        h1, h2 {
            color: var(--primary-color);
            text-align: center;
        }
        p {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 25px;
        }
        .question-box {
            margin-bottom: 20px;
        }
        .options button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: 0.2s;
        }
        .options button:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA DO QUIZ -->
        <div id="quizApp">
            <h1>Bússola Eleitoral 2026</h1>
            <p>Descubra sua afinidade política entre os principais pré-candidatos nacionais.</p>
            <div id="questionContainer"></div>
        </div>

        <!-- TELA DE RESULTADOS -->
        <div id="resultsApp" class="hidden">
            <h1>Seu Resultado</h1>
            <h2 id="resTitle" style="color: var(--accent-color);"></h2>
            <p id="resDesc"></p>
            <p><strong>Candidatos mais alinhados:</strong> <span id="resCandidatos" style="color: var(--primary-color); font-weight: bold;"></span></p>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">
            
            <h2>📊 Prévia Nacional em Tempo Real</h2>
            <div style="max-width: 300px; margin: 0 auto;">
                <canvas id="statsChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const questoes = [
            {
                pergunta: "1. Qual deve ser o principal papel do Estado na economia?",
                opcoes: [
                    { texto: "Mínimo intervenção, priorizando privatizações e livre mercado.", choice: "A" },
                    { texto: "Foco em investimentos sociais e forte regulação estatal.", choice: "B" },
                    { texto: "Governança técnica baseada em dados e reformas estruturais moderadas.", choice: "C" }
                ]
            },
            {
                pergunta: "2. Em relação a pautas de costumes e segurança pública:",
                opcoes: [
                    { texto: "Rigor absoluto nas leis, defesa da família tradicional e ordem pública.", choice: "A" },
                    { texto: "Enfoque em direitos sociais, inclusão e políticas humanizadas.", choice: "B" },
                    { texto: "Equilíbrio institucional com foco em gestão e pragmatismo legal.", choice: "C" }
                ]
            }
        ];

        let currentQuestion = 0;
        let userAnswers = [];

        function loadQuestion() {
            const container = document.getElementById('questionContainer');
            if (currentQuestion < questoes.length) {
                const q = questoes[currentQuestion];
                let html = `<div class="question-box"><h3>${q.pergunta}</h3><div class="options">`;
                q.opcoes.forEach(opt => {
                    html += `<button onclick="selectAnswer('${opt.choice}')">${opt.texto}</button>`;
                });
                html += `</div></div>`;
                container.innerHTML = html;
            } else {
                mostrarResultadosDireto();
            }
        }

        function selectAnswer(choice) {
            userAnswers.push({ choice });
            currentQuestion++;
            loadQuestion();
        }

        function mostrarResultadosDireto() {
            document.getElementById('quizApp').classList.add('hidden');
            document.getElementById('resultsApp').classList.remove('hidden');

            document.getElementById('resTitle').innerText = "Alinhamento Social / Desenvolvimentista";
            document.getElementById('resDesc').innerText = "Você demonstra forte afinidade com políticas voltadas ao bem-estar social e fortalecimento de redes de proteção.";
            document.getElementById('resCandidatos').innerText = "Luiz Inácio Lula da Silva ou Samara Martins";

            const ctx = document.getElementById('statsChart').getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Liberal / Reformista', 'Social / Desenvolvimentista', 'Pragmático / Moderado'],
                    datasets: [{
                        data: [35, 45, 20],
                        backgroundColor: ['#ef4444', '#3b82f6', '#10b981']
                    }]
                }
            });
        }

        loadQuestion();
    </script>
</body>
</html>
